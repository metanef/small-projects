<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Small Projects — A tactile Neumorphic (Soft UI) portfolio showcasing web experiments, tools, games, and mini-apps.">

  <title>Small Projects ✦ Web Experiments & Soft UI Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Favicon & Stylesheet -->
  <link rel="icon" type="image/svg+xml" href="src/logo.svg">
  <link rel="stylesheet" href="src/style.css">

  <!-- Lenis Smooth Scroll & Application Script -->
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="src/script.js" defer></script>
</head>

<body>

  <!-- Header -->
  <header id="top">
    <div class="header-top-bar">
      <span class="eyebrow">✦ portfolio</span>
      <label class="switch" title="Toggle Dark Mode">
        <input class="checkbox" id="themeToggle" type="checkbox" aria-label="Toggle Dark Mode">
        <span class="slider">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </span>
      </label>
    </div>
    <h1>
      <span class="accent">small projects
        <svg viewBox="0 0 200 14" preserveAspectRatio="none">
          <path d="M2 10 Q 50 2, 100 8 T 198 6" stroke="var(--accent)" stroke-width="4" fill="none" stroke-linecap="round" />
        </svg>
      </span>
    </h1>
    <p class="sub">A collection of web experiments, tools, and visuals<br>Click a tile to explore</p>
  </header>

  <!-- Category Filters -->
  <nav class="filters" id="filters" aria-label="Project Category Filters"></nav>

  <!-- Main Grid -->
  <main>
    <section class="grid" id="grid" aria-label="Project Showcase Grid"></section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="links">
      <a href="https://github.com/metanef/small-projects" target="_blank" rel="noopener">GitHub</a>
      <a href="https://eloi.framer.website/" target="_blank" rel="noopener">Contact</a>
      <a href="#top">Back to top ↑</a>
    </div>
    <p>Made with fun and too many open tabs - © 2026 metanef</p>
  </footer>

  <!-- Project Detail Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal" id="modalCard">
      <button class="close-x" id="closeModal" aria-label="Close modal">✕</button>
      <div class="art" id="modalArt"></div>
      <div class="body">
        <span class="cat-tag" id="modalCat"></span>
        <h3 id="modalName"></h3>
        <p id="modalDesc"></p>
        <div class="actions">
          <a class="btn primary" id="modalLink" href="#" target="_blank" rel="noopener">View Project ↗</a>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
