<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lab — Web & Visual Creations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="src/script.js" defer></script>
</head>

<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <header id="top">
    <span class="eyebrow">✦ portfolio</span>
    <h1><span class="accent">small projects<svg viewBox="0 0 200 14" preserveAspectRatio="none">
          <path d="M2 10 Q 50 2, 100 8 T 198 6" stroke="#4f46e5" stroke-width="4" fill="none" stroke-linecap="round" />
        </svg></span></h1>
    <p class="sub">A collection of web experiments, tools, and visuals<br>Click a tile to explore</p>
  </header>

  <div class="filters" id="filters"></div>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="links">
      <a href="https://github.com/metanef/small-projects" target="_blank" rel="noopener">GitHub</a>
      <a href="#top">Back to top ↑</a>
    </div>
    <p>Made with fun and too many open tabs - © 2026 metanef</p>
  </footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalCard" style="position:relative;">
      <div class="close-x" id="closeModal">✕</div>
      <div class="art" id="modalArt"></div>
      <div class="body">
        <span class="cat-tag" id="modalCat"></span>
        <h3 id="modalName"></h3>
        <p id="modalDesc"></p>
        <div class="actions">
          <a class="btn primary" id="modalLink" href="#" target="_blank" rel="noopener">View Project ↗</a>
          <button class="btn ghost" id="modalCancel">Close</button>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
