<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>

    <!-- Carved / Sunken Bevel Filter for Engraved Letters (S & P) -->
    <filter id="carved-bevel" x="-30%" y="-30%" width="160%" height="160%">
      <!-- Top-Left Inner Shadow (Carved depth) -->
      <feOffset dx="2.5" dy="2.5"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#64748b" flood-opacity="0.8" result="shadow-color"/>
      <feComposite operator="in" in="shadow-color" in2="inverse" result="shadow"/>

      <!-- Bottom-Right Inner Light Bevel (Carved lip highlight) -->
      <feOffset dx="-2" dy="-2" in="SourceGraphic"/>
      <feGaussianBlur stdDeviation="1.5" result="light-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="light-blur" result="inverse-light"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.95" result="light-color"/>
      <feComposite operator="in" in="light-color" in2="inverse-light" result="highlight"/>

      <!-- Composite Base + Inner Shadow + Highlight -->
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="highlight"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Monogram "SP" Group - Enlarged (+50%) Standalone Carved Monogram -->
  <g transform="translate(100, 100) scale(2)" filter="url(#carved-bevel)">
    <!-- Letter 'S' - Carved Inset Path -->
    <path d="M -12 -22 C -28 -22 -28 -7 -14 -2 C 0 3 0 22 -14 22 C -26 22 -28 14 -28 10" 
          fill="none" 
          stroke="#cbd5e1" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Letter 'P' - Carved Inset Path (Extended lower bowl) -->
    <path d="M 10 -22 L 10 22 M 10 -22 L 22 -22 C 38 -22 38 4 22 4 L 10 4" 
          fill="none" 
          stroke="#cbd5e1" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
