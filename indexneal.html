<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léo Martel — Bazar Créatif</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;500;700&display=swap');

  :root{
    --bg: #FAF6EE;
    --ink: #1C1C1E;
    --coral: #FF6B5E;
    --yellow: #FFC93C;
    --teal: #2EC4B6;
    --purple: #9D6BFF;
    --blue: #4C7DFF;
    --pink: #FF5C93;
    --green: #06D6A0;
    --radius: 22px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
    padding-bottom:40px;
  }
  h1,h2,h3, .pill, .tile-title{font-family:'Fredoka', sans-serif;}

  /* Decorative floating shapes */
  .float-shape{
    position:absolute;
    border-radius:50%;
    opacity:.5;
    pointer-events:none;
    animation: floaty 7s ease-in-out infinite;
    z-index:0;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-18px) rotate(12deg);}
  }

  header{
    position:relative;
    max-width:1100px;
    margin:0 auto;
    padding:60px 24px 20px;
    text-align:center;
    z-index:1;
  }
  header h1{
    font-size:clamp(2.2rem, 6vw, 3.6rem);
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  header h1 .wave{
    display:inline-block;
    animation: wave 2.2s ease-in-out infinite;
    transform-origin: 70% 70%;
  }
  @keyframes wave{
    0%,60%,100%{transform:rotate(0deg);}
    10%,30%{transform:rotate(14deg);}
    20%{transform:rotate(-8deg);}
  }
  header p.tagline{
    margin-top:10px;
    font-size:1.05rem;
    font-weight:500;
    color:#555;
  }

  /* Filters */
  .filters{
    max-width:1100px;
    margin:24px auto 8px;
    padding:0 24px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    position:relative;
    z-index:1;
  }
  .pill{
    border:2px solid var(--ink);
    background:#fff;
    padding:9px 18px;
    border-radius:999px;
    font-weight:500;
    font-size:.92rem;
    cursor:pointer;
    transition: transform .18s ease, background .18s ease, color .18s ease;
    user-select:none;
  }
  .pill:hover{ transform: translateY(-3px) rotate(-1deg); }
  .pill.active{
    background:var(--ink);
    color:#fff;
  }

  /* Grid */
  .grid{
    max-width:1100px;
    margin:36px auto;
    padding:0 24px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 130px;
    gap:18px;
    position:relative;
    z-index:1;
  }
  @media (max-width: 900px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px){
    .grid{ grid-template-columns: 1fr; grid-auto-rows: 180px; }
  }

  .tile{
    border-radius: var(--radius);
    border:3px solid var(--ink);
    padding:18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    color:var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    transition: transform .22s cubic-bezier(.2,.8,.3,1.4), box-shadow .22s ease;
    will-change: transform;
  }
  .tile:hover{
    transform: translate(-4px,-6px) rotate(-1.5deg) scale(1.02);
    box-shadow: 12px 12px 0 var(--ink);
  }
  .tile:nth-child(even):hover{ transform: translate(4px,-6px) rotate(1.5deg) scale(1.02); }

  .tile .emoji{
    font-size:2.4rem;
    filter: drop-shadow(2px 2px 0 rgba(0,0,0,.15));
  }
  .tile .tile-title{
    font-size:1.15rem;
    font-weight:700;
    line-height:1.2;
    margin-top:8px;
  }
  .tile .tile-cat{
    align-self:flex-start;
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    background:rgba(255,255,255,.6);
    border:2px solid var(--ink);
    padding:3px 10px;
    border-radius:999px;
    margin-top:10px;
  }

  /* size variants */
  .size-lg{ grid-column: span 2; grid-row: span 2; }
  .size-wide{ grid-column: span 2; grid-row: span 1; }
  .size-tall{ grid-column: span 1; grid-row: span 2; }
  .size-sm{ grid-column: span 1; grid-row: span 1; }
  @media (max-width: 520px){
    .size-lg, .size-wide, .size-tall, .size-sm{ grid-column: span 1; grid-row: span 1; }
  }

  .c-coral{ background:var(--coral); }
  .c-yellow{ background:var(--yellow); }
  .c-teal{ background:var(--teal); }
  .c-purple{ background:var(--purple); }
  .c-blue{ background:var(--blue); color:#fff; }
  .c-pink{ background:var(--pink); }
  .c-green{ background:var(--green); }

  .hidden{ display:none !important; }

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(28,28,30,.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
  }
  .overlay.open{ opacity:1; pointer-events:all; }

  .modal{
    background:#fff;
    border:3px solid var(--ink);
    border-radius: 26px;
    max-width:560px;
    width:100%;
    padding:32px;
    position:relative;
    transform: translateY(20px) scale(.96);
    transition: transform .25s cubic-bezier(.2,.8,.3,1.3);
    box-shadow: 10px 10px 0 var(--ink);
  }
  .overlay.open .modal{ transform: translateY(0) scale(1); }

  .modal .close-btn{
    position:absolute; top:14px; right:14px;
    width:34px; height:34px;
    border-radius:50%;
    border:2px solid var(--ink);
    background:#fff;
    font-size:1.1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, background .15s ease;
  }
  .modal .close-btn:hover{ transform:rotate(90deg); background:var(--yellow); }

  .modal .modal-emoji{
    font-size:3.2rem;
    display:inline-block;
    background:var(--yellow);
    border:3px solid var(--ink);
    border-radius:20px;
    padding:14px 16px;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .modal h2{ font-size:1.6rem; margin-top:16px; }
  .modal .modal-cat{
    display:inline-block;
    margin-top:8px;
    font-size:.75rem;
    font-weight:700;
    text-transform:uppercase;
    background:var(--ink);
    color:#fff;
    padding:4px 12px;
    border-radius:999px;
  }
  .modal p.desc{
    margin-top:16px;
    line-height:1.55;
    color:#333;
  }
  .modal a.cta{
    display:inline-block;
    margin-top:22px;
    background:var(--coral);
    border:3px solid var(--ink);
    color:var(--ink);
    font-weight:700;
    text-decoration:none;
    padding:11px 22px;
    border-radius:999px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .modal a.cta:hover{ transform: translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }

  footer{
    max-width:1100px;
    margin:60px auto 0;
    padding:24px 24px 0;
    text-align:center;
    border-top:2px dashed #ccc;
  }
  footer .links{
    display:flex; gap:18px; justify-content:center; margin-bottom:10px; flex-wrap:wrap;
  }
  footer a{
    color:var(--ink);
    font-weight:700;
    text-decoration:none;
    border-bottom:2px solid var(--coral);
  }
  footer p{ font-size:.85rem; color:#888; margin-top:10px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="float-shape" style="width:60px;height:60px;background:var(--yellow); top:40px; left:6%; animation-delay:0s;"></div>
<div class="float-shape" style="width:36px;height:36px;background:var(--teal); top:120px; right:10%; animation-delay:1.2s;"></div>
<div class="float-shape" style="width:26px;height:26px;background:var(--pink); top:260px; left:14%; animation-delay:2.4s;"></div>

<header>
  <h1><span class="wave">👋</span> Léo Martel</h1>
  <p class="tagline">Je bricole des trucs sur internet et parfois ça marche.</p>
</header>

<div class="filters" id="filters"></div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<footer>
  <div class="links">
    <a href="#" target="_blank">Twitter/X</a>
    <a href="#" target="_blank">GitHub</a>
    <a href="#" target="_blank">Dribbble</a>
    <a href="mailto:hello@leomartel.fr">hello@leomartel.fr</a>
  </div>
  <p>Fait avec du café et trop d'onglets ouverts. © 2026</p>
</footer>

<script>
// ---------------------------------------------------------
// DONNÉES DES PROJETS — ajoute/modifie ici, rien à toucher ailleurs
// ---------------------------------------------------------
const PROJECTS = [
  {
    id: "cloud-sorter",
    title: "Trieur de Nuages",
    category: "Expérience",
    emoji: "☁️",
    color: "c-blue",
    size: "size-lg",
    desc: "Un site qui classe les nuages que tu prends en photo selon leur niveau de ressemblance avec un animal. Spoiler : c'est toujours un lapin.",
    link: "#"
  },
  {
    id: "pixel-garden",
    title: "Jardin de Pixels",
    category: "Web interactif",
    emoji: "🌱",
    color: "c-green",
    size: "size-wide",
    desc: "Un jardin collaboratif où chaque visiteur plante un pixel-fleur. Il pousse, il fane, il repousse. Personne ne sait vraiment pourquoi.",
    link: "#"
  },
  {
    id: "sad-robot",
    title: "Robot Mélancolique",
    category: "Illustration",
    emoji: "🤖",
    color: "c-purple",
    size: "size-tall",
    desc: "Série d'illustrations d'un petit robot qui traverse des états d'âme très humains. Épisode 4 : il a perdu sa boîte à outils.",
    link: "#"
  },
  {
    id: "click-counter",
    title: "Le Compteur Inutile",
    category: "Outil",
    emoji: "🔢",
    color: "c-yellow",
    size: "size-sm",
    desc: "Un bouton. Tu cliques. Ça compte. C'est tout. C'est le projet dont je suis le plus fier.",
    link: "#"
  },
  {
    id: "font-mixer",
    title: "Mixeur de Polices",
    category: "Outil",
    emoji: "🔤",
    color: "c-coral",
    size: "size-sm",
    desc: "Génère des combinaisons de polices aléatoires, certaines illisibles, certaines magnifiques, rarement les deux.",
    link: "#"
  },
  {
    id: "tiny-worlds",
    title: "Micro-Mondes",
    category: "Expérience",
    emoji: "🪐",
    color: "c-teal",
    size: "size-wide",
    desc: "Des planètes miniatures que tu peux faire tourner, peupler et détruire d'un clic. Aucune conséquence réelle, promis.",
    link: "#"
  },
  {
    id: "sound-shapes",
    title: "Formes Sonores",
    category: "Web interactif",
    emoji: "🎧",
    color: "c-pink",
    size: "size-tall",
    desc: "Dessine une forme, elle devient un son. Résultat souvent étrange, parfois carrément joli.",
    link: "#"
  },
  {
    id: "moodboard-machine",
    title: "Machine à Moodboards",
    category: "Illustration",
    emoji: "🎨",
    color: "c-blue",
    size: "size-sm",
    desc: "Génère un moodboard complet en trois clics à partir d'un mot. Testé avec 'nostalgie', résultat troublant de justesse.",
    link: "#"
  }
];

const CATEGORIES = ["Tous", ...new Set(PROJECTS.map(p => p.category))];

// ---------------------------------------------------------
// RENDU
// ---------------------------------------------------------
const filtersEl = document.getElementById('filters');
const gridEl = document.getElementById('grid');
const overlayEl = document.getElementById('overlay');
const modalEl = document.getElementById('modal');

let activeCategory = "Tous";

function renderFilters(){
  filtersEl.innerHTML = CATEGORIES.map(cat => `
    <button class="pill ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>
  `).join('');

  filtersEl.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      renderFilters();
      renderGrid();
    });
  });
}

function renderGrid(){
  const visible = PROJECTS.filter(p => activeCategory === "Tous" || p.category === activeCategory);
  gridEl.innerHTML = visible.map(p => `
    <div class="tile ${p.color} ${p.size}" data-id="${p.id}">
      <span class="emoji">${p.emoji}</span>
      <div>
        <div class="tile-title">${p.title}</div>
        <span class="tile-cat">${p.category}</span>
      </div>
    </div>
  `).join('');

  gridEl.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', () => openModal(tile.dataset.id));
  });
}

function openModal(id){
  const p = PROJECTS.find(x => x.id === id);
  if(!p) return;
  modalEl.innerHTML = `
    <button class="close-btn" id="closeBtn">✕</button>
    <span class="modal-emoji">${p.emoji}</span>
    <h2>${p.title}</h2>
    <span class="modal-cat">${p.category}</span>
    <p class="desc">${p.desc}</p>
    <a class="cta" href="${p.link}" target="_blank" rel="noopener">Voir le projet →</a>
  `;
  overlayEl.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeModal);
}

function closeModal(){
  overlayEl.classList.remove('open');
}

overlayEl.addEventListener('click', (e) => {
  if(e.target === overlayEl) closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});

renderFilters();
renderGrid();
</script>

</body>
</html>
